apply plugin: "com.android.library"
apply plugin: "com.facebook.react"

react {
    // Let the RN Gradle plugin know this is a native library that requires codegen. The value must
    // match the JS spec name so the generated C++ target is `react_codegen_CodePush` which the
    // autolinking CMake expects.
    libraryName = "CodePush"
}

def DEFAULT_COMPILE_SDK_VERSION = 33
def DEFAULT_BUILD_TOOLS_VERSION = "33.0.0"
def DEFAULT_TARGET_SDK_VERSION = 33
def DEFAULT_MIN_SDK_VERSION = 21

android {
    namespace "com.microsoft.codepush.react"

    compileSdkVersion rootProject.hasProperty('compileSdkVersion') ? rootProject.compileSdkVersion : DEFAULT_COMPILE_SDK_VERSION
    buildToolsVersion rootProject.hasProperty('buildToolsVersion') ? rootProject.buildToolsVersion : DEFAULT_BUILD_TOOLS_VERSION

    defaultConfig {
        minSdkVersion rootProject.hasProperty('minSdkVersion') ? rootProject.minSdkVersion : DEFAULT_MIN_SDK_VERSION
        targetSdkVersion rootProject.hasProperty('targetSdkVersion') ? rootProject.targetSdkVersion : DEFAULT_TARGET_SDK_VERSION
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", "true"
        versionCode 1
        versionName "1.0"
    }

    lintOptions {
        abortOnError false
    }

    defaultConfig {
        consumerProguardFiles 'proguard-rules.pro'
    }
}

dependencies {
    implementation "com.facebook.react:react-native:+"
    implementation 'com.nimbusds:nimbus-jose-jwt:9.37.3'
}
